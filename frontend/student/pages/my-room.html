<!-- Student My Room Page -->
<div class="container-fluid">
    <div id="roomContent">
        <div class="text-center py-5">
            <div class="spinner-border text-success"></div>
            <p class="mt-2">Memuat informasi kamar...</p>
        </div>
    </div>
</div>

<script>
    async function initMyRoomPage() {
        const room = await window.studentDashboard.loadMyRoom();

        const container = document.getElementById('roomContent');

        if (!room) {
            container.innerHTML = `
            <div class="text-center py-5">
                <i class="fas fa-bed fa-4x text-muted mb-4"></i>
                <h4>Anda Belum Memiliki Kamar</h4>
                <p class="text-muted">Silakan ajukan pemesanan kamar terlebih dahulu</p>
                <button class="btn btn-success mt-3" onclick="loadPage('bookings')">
                    <i class="fas fa-calendar-plus me-2"></i>Pesan Kamar
                </button>
            </div>
        `;
            return;
        }

        container.innerHTML = `
        <div class="row g-4">
            <!-- Room Info Card -->
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-bed me-2"></i>Informasi Kamar</h5>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <h1 class="display-3 fw-bold text-success">${room.room_number}</h1>
                            <p class="text-muted">Nomor Kamar Anda</p>
                        </div>
                        
                        <div class="list-group list-group-flush">
                            <div class="list-group-item d-flex justify-content-between">
                                <span><i class="fas fa-building text-success me-2"></i>Gedung</span>
                                <strong>${room.building}</strong>
                            </div>
                            <div class="list-group-item d-flex justify-content-between">
                                <span><i class="fas fa-layer-group text-success me-2"></i>Lantai</span>
                                <strong>${room.floor}</strong>
                            </div>
                            <div class="list-group-item d-flex justify-content-between">
                                <span><i class="fas fa-users text-success me-2"></i>Kapasitas</span>
                                <strong>${room.current_occupancy || 0}/${room.capacity} orang</strong>
                            </div>
                            <div class="list-group-item d-flex justify-content-between">
                                <span><i class="fas fa-money-bill-wave text-success me-2"></i>Tarif Bulanan</span>
                                <strong class="text-success">${formatCurrency(room.monthly_rate)}</strong>
                            </div>
                            <div class="list-group-item d-flex justify-content-between">
                                <span><i class="fas fa-circle text-success me-2"></i>Status</span>
                                <span class="badge ${getStatusBadge(room.status)}">${room.status}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Roommates Card -->
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-users me-2"></i>Teman Sekamar</h5>
                    </div>
                    <div class="card-body">
                        <div id="roommatesList">
                            ${room.residents && room.residents.length > 0 ?
                room.residents.map(r => `
                                    <div class="d-flex align-items-center mb-3 p-3 bg-light rounded">
                                        <div class="flex-shrink-0">
                                            <div class="rounded-circle bg-info text-white d-flex align-items-center justify-content-center" 
                                                 style="width: 50px; height: 50px;">
                                                <i class="fas fa-user"></i>
                                            </div>
                                        </div>
                                        <div class="flex-grow-1 ms-3">
                                            <h6 class="mb-1">${r.user?.name || 'Unknown'}</h6>
                                            <small class="text-muted">${r.user?.email || '-'}</small>
                                        </div>
                                    </div>
                                `).join('')
                : '<p class="text-muted text-center py-4">Belum ada teman sekamar</p>'
            }
                        </div>
                    </div>
                </div>
            </div>

            <!-- Room Description -->
            ${room.description ? `
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-info-circle me-2"></i>Deskripsi Kamar</h5>
                        </div>
                        <div class="card-body">
                            <p class="mb-0">${room.description}</p>
                        </div>
                    </div>
                </div>
            ` : ''}

            <!-- Quick Actions -->
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-bolt me-2"></i>Aksi Cepat</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <button class="btn btn-outline-success w-100" onclick="loadPage('payments')">
                                    <i class="fas fa-money-bill-wave fa-2x mb-2"></i><br>
                                    Lihat Pembayaran
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-outline-warning w-100" onclick="loadPage('repairs')">
                                    <i class="fas fa-tools fa-2x mb-2"></i><br>
                                    Laporkan Kerusakan
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-outline-info w-100" onclick="loadPage('profile')">
                                    <i class="fas fa-user-circle fa-2x mb-2"></i><br>
                                    Edit Profil
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;
    }
</script>
