<!DOCTYPE html>
<html lang="id" class="student">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Mahasiswa - Sistem Asrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../common/css/student.css">
</head>

<body class="student">
    <!-- Student Navigation -->
    <nav class="navbar navbar-light bg-white border-bottom fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand text-success fw-bold" href="#">
                <i class="fas fa-university me-2"></i>
                Asrama Mahasiswa
            </a>
            <div class="d-flex align-items-center">
                <div class="dropdown">
                    <button class="btn btn-outline-success dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-user-graduate me-2"></i>
                        <span id="studentName">Mahasiswa</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#" onclick="loadPage('profile')">
                                <i class="fas fa-user me-2"></i>Profil Saya
                            </a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item text-danger" href="#" onclick="logout()">
                                <i class="fas fa-sign-out-alt me-2"></i>Logout
                            </a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Student Sidebar -->
    <div class="container-fluid">
        <div class="row">
            <nav id="studentSidebar" class="col-md-3 col-lg-2 sidebar">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <div class="student-avatar mb-3">
                            <i class="fas fa-user-graduate fa-2x"></i>
                        </div>
                        <h6 id="sidebarStudentName" class="mb-1 fw-bold">-</h6>
                        <small class="text-muted" id="sidebarStudentEmail">-</small>
                    </div>

                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" data-page="dashboard">
                                <i class="fas fa-home"></i>Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="my-room">
                                <i class="fas fa-bed"></i>Kamar Saya
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="bookings">
                                <i class="fas fa-calendar-check"></i>Pemesanan
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="payments">
                                <i class="fas fa-money-bill-wave"></i>Pembayaran
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="repairs">
                                <i class="fas fa-tools"></i>Perbaikan
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="profile">
                                <i class="fas fa-user-circle"></i>Profil
                            </a>
                        </li>
                    </ul>

                    <!-- Quick Stats -->
                    <div class="mt-4 pt-3 border-top">
                        <h6 class="sidebar-heading px-3 mb-2">Status Kamar</h6>
                        <div class="px-3">
                            <div class="alert alert-success py-2 small mb-2" id="roomStatusAlert">
                                <i class="fas fa-info-circle me-1"></i>
                                <span id="roomStatusText">Memuat...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Main Content Area -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3">
                    <h1 class="h3" id="pageTitle">Dashboard Saya</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button type="button" class="btn btn-sm btn-outline-success" onclick="refreshData()">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                </div>

                <!-- Dynamic Content Container -->
                <div id="contentContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-success" role="status"></div>
                        <p class="mt-2">Memuat dashboard...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../common/js/auth.js"></script>
    <script src="js/student-app.js"></script>
    <script>
        // Initialize Student App
        document.addEventListener('DOMContentLoaded', function () {
            // Check if user is student
            if (!window.auth || !window.auth.isAuthenticated()) {
                window.location.href = '/login?role=student';
                return;
            }

            if (window.auth.user.role !== 'student') {
                alert('Akses ditolak. Halaman ini hanya untuk mahasiswa.');
                window.location.href = '/admin';
                return;
            }

            // Update student name
            document.getElementById('studentName').textContent = window.auth.user.name;
            document.getElementById('sidebarStudentName').textContent = window.auth.user.name;
            document.getElementById('sidebarStudentEmail').textContent = window.auth.user.email;

            // Load student's room status
            loadRoomStatus();

            // Load dashboard initially
            loadPage('dashboard');

            // Setup navigation
            document.querySelectorAll('[data-page]').forEach(link => {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    const page = this.getAttribute('data-page');
                    loadPage(page);

                    // Update active state
                    document.querySelectorAll('.nav-link').forEach(nav => {
                        nav.classList.remove('active');
                    });
                    this.classList.add('active');
                });
            });
        });

        async function loadRoomStatus() {
            try {
                const response = await window.auth.fetchWithAuth('/api/student/my-room');
                if (response && response.ok) {
                    const room = await response.json();
                    document.getElementById('roomStatusText').textContent = `Kamar ${room.room_number}`;
                } else {
                    document.getElementById('roomStatusText').textContent = 'Belum ada kamar';
                    document.getElementById('roomStatusAlert').className = 'alert alert-warning py-2 small mb-2';
                }
            } catch (error) {
                document.getElementById('roomStatusText').textContent = 'Belum ada kamar';
                document.getElementById('roomStatusAlert').className = 'alert alert-warning py-2 small mb-2';
            }
        }

        function loadPage(page) {
            const container = document.getElementById('contentContainer');
            const title = document.getElementById('pageTitle');

            // Set page title
            const pageTitles = {
                'dashboard': 'Dashboard Saya',
                'my-room': 'Kamar Saya',
                'bookings': 'Pemesanan Kamar',
                'payments': 'Pembayaran Saya',
                'repairs': 'Perbaikan',
                'profile': 'Profil & Pengaturan'
            };
            title.textContent = pageTitles[page] || 'Dashboard Mahasiswa';

            // Show loading
            container.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-success" role="status"></div>
                    <p class="mt-2">Memuat halaman...</p>
                </div>
            `;

            // Load page content
            // Add timestamp to prevent caching during development
            fetch(`pages/${page}.html?t=${new Date().getTime()}`)
                .then(response => {
                    if (!response.ok) throw new Error('Page not found');
                    return response.text();
                })
                .then(html => {
                    container.innerHTML = html;

                    // Execute scripts found in the loaded content
                    const scripts = container.getElementsByTagName("script");
                    for (let i = 0; i < scripts.length; i++) {
                        const script = document.createElement("script");
                        if (scripts[i].src) {
                            script.src = scripts[i].src;
                        } else {
                            script.text = scripts[i].text;
                        }
                        document.body.appendChild(script);
                    }

                    // Initialize page-specific scripts
                    // We need a small delay to ensure the script is parsed and executed
                    setTimeout(() => {
                        const initFunctionName = `init${page.split('-').map(word =>
                            word.charAt(0).toUpperCase() + word.slice(1)).join('')}Page`;
                        if (typeof window[initFunctionName] === 'function') {
                            window[initFunctionName]();
                        }
                    }, 50);
                })
                .catch(error => {
                    container.innerHTML = `
                        <div class="alert alert-warning">
                            <h5><i class="fas fa-exclamation-triangle me-2"></i>Halaman Belum Tersedia</h5>
                            <p>Halaman "${page}" sedang dalam pengembangan.</p>
                            <button class="btn btn-success btn-sm" onclick="loadPage('dashboard')">
                                <i class="fas fa-home me-1"></i> Kembali ke Dashboard
                            </button>
                        </div>
                    `;
                });
        }

        function refreshData() {
            loadRoomStatus();
            const currentPage = document.querySelector('.nav-link.active')?.getAttribute('data-page') || 'dashboard';
            loadPage(currentPage);
        }

        function logout() {
            if (confirm('Apakah Anda yakin ingin logout?')) {
                window.auth.logout();
            }
        }
    </script>
</body>

</html>
