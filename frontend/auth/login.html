<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Manajemen Asrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }

        .role-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            text-align: center;
        }

        .role-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .role-card.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #f0f4ff 0%, #e7f0ff 100%);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .role-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            transition: all 0.3s ease;
        }

        .role-card:hover .role-icon {
            transform: scale(1.1);
        }

        .role-card.active .role-icon {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .role-card.admin .role-icon {
            color: #667eea;
        }

        .role-card.student .role-icon {
            color: #10b981;
        }

        .main-card {
            background: white;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="main-card">
                    <div class="card-body p-5">
                        <div class="text-center mb-5">
                            <h1 class="display-5 fw-bold mb-2">
                                <i class="fas fa-university text-primary"></i>
                                Sistem Manajemen Asrama
                            </h1>
                            <p class="text-muted">Pilih peran Anda untuk melanjutkan</p>
                        </div>

                        <!-- Role Selection -->
                        <div class="row g-4 mb-5">
                            <div class="col-md-6">
                                <div class="role-card admin" onclick="selectRole('admin')">
                                    <div class="role-icon">
                                        <i class="fas fa-user-shield"></i>
                                    </div>
                                    <h4 class="fw-bold mb-2">Administrator</h4>
                                    <p class="text-muted small mb-0">
                                        Untuk pengelola dan admin sistem asrama
                                    </p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="role-card student active" onclick="selectRole('student')">
                                    <div class="role-icon">
                                        <i class="fas fa-user-graduate"></i>
                                    </div>
                                    <h4 class="fw-bold mb-2">Mahasiswa</h4>
                                    <p class="text-muted small mb-0">
                                        Untuk penghuni asrama mahasiswa
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm" onsubmit="handleLogin(event)">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control form-control-lg" id="email"
                                    placeholder="email@example.com" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control form-control-lg" id="password"
                                    placeholder="Masukkan password" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-login btn-lg w-100">
                                <i class="fas fa-sign-in-alt me-2"></i>Masuk sebagai Mahasiswa
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="text-muted mb-2">
                                Belum punya akun?
                                <a href="/register" class="text-decoration-none fw-semibold">
                                    Daftar sebagai Mahasiswa
                                </a>
                            </p>
                            <p class="text-muted small">
                                <i class="fas fa-info-circle me-1"></i>
                                Untuk akun admin, hubungi administrator sistem
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../common/js/auth.js"></script>
    <script>
        let selectedRole = 'student';

        function selectRole(role) {
            selectedRole = role;

            // Update UI
            document.querySelectorAll('.role-card').forEach(card => {
                card.classList.remove('active');
            });
            document.querySelector(`.role-card.${role}`).classList.add('active');

            // Update button text
            const submitBtn = document.querySelector('#loginForm button[type="submit"]');
            if (role === 'admin') {
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Masuk sebagai Administrator';
                submitBtn.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            } else {
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Masuk sebagai Mahasiswa';
                submitBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #3b82f6 100%)';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = event.target.querySelector('button[type="submit"]');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Loading...';

            try {
                await window.auth.login(email, password);
            } catch (error) {
                alert('Login gagal: ' + error.message);
                submitBtn.disabled = false;
                selectRole(selectedRole); // Reset button text
            }
        }

        // Auto-select role from URL parameter
        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const roleParam = urlParams.get('role');

            if (roleParam === 'admin' || roleParam === 'student') {
                selectRole(roleParam);
            }
        });
    </script>
</body>

</html>
