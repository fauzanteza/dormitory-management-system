<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - Sistem Asrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/style.css">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
        }

        .sidebar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            min-height: 100vh;
            position: fixed;
            width: 250px;
            z-index: 1000;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            margin: 5px 10px;
            border-radius: 10px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .profile-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .profile-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            height: 150px;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            margin-top: -60px;
            background: #fff;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--primary);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .nav-pills .nav-link.active {
            background-color: var(--primary);
        }

        .nav-pills .nav-link {
            color: #6c757d;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="p-4">
            <div class="d-flex align-items-center mb-4">
                <div class="bg-white rounded-circle p-2 me-3"><i class="fas fa-university text-primary fa-lg"></i></div>
                <h4 class="mb-0">Sistem Asrama</h4>
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" href="/dashboard" id="menu-dashboard"><i
                        class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                <a class="nav-link" href="/rooms" id="menu-rooms"><i class="fas fa-bed me-2"></i>Kamar</a>
                <a class="nav-link" href="/residents" id="menu-residents"><i class="fas fa-users me-2"></i>Penghuni</a>
                <a class="nav-link" href="/payments" id="menu-payments"><i
                        class="fas fa-money-bill-wave me-2"></i>Pembayaran</a>
                <a class="nav-link" href="/repairs" id="menu-repairs"><i class="fas fa-tools me-2"></i>Perbaikan</a>
                <a class="nav-link" href="/users" id="menu-users"><i class="fas fa-user-cog me-2"></i>User</a>
                <div class="mt-4 pt-4 border-top border-white-10">
                    <a class="nav-link active" href="/profile" id="menu-profile"><i
                            class="fas fa-user-circle me-2"></i>Profil</a>
                    <a class="nav-link text-danger" href="#" onclick="window.app.logout()"><i
                            class="fas fa-sign-out-alt me-2"></i>Logout</a>
                </div>
            </nav>
        </div>
    </div>

    <div class="main-content">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="profile-card text-center pb-4 h-100">
                    <div class="profile-header"></div>
                    <div class="d-flex justify-content-center">
                        <!-- Placeholder/Avatar -->
                        <div class="profile-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                    </div>
                    <div class="px-4 mt-3">
                        <h4 class="fw-bold mb-1" id="profileName">-</h4>
                        <p class="text-muted mb-3" id="profileRole">-</p>

                        <div class="d-flex justify-content-center gap-2 mb-4">
                            <span class="badge bg-light text-dark border"><i class="fas fa-envelope me-1"></i> <span
                                    id="profileEmail">-</span></span>
                        </div>

                        <div class="border-top pt-3 text-start">
                            <small class="text-muted d-block mb-2">INFO KONTAK</small>
                            <div class="d-flex align-items-center mb-2">
                                <i class="fas fa-phone text-primary me-3" style="width:20px"></i>
                                <span id="profilePhone">-</span>
                            </div>
                            <div class="d-flex align-items-center">
                                <i class="fas fa-calendar text-primary me-3" style="width:20px"></i>
                                <span id="profileJoined">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card border-0 shadow-sm rounded-15">
                    <div class="card-header bg-white border-0 pt-4 px-4">
                        <ul class="nav nav-pills card-header-pills">
                            <li class="nav-item">
                                <a class="nav-link active" data-bs-toggle="pill" href="#edit-profile">Edit Profil</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" data-bs-toggle="pill" href="#change-password">Ganti Password</a>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body p-4">
                        <div class="tab-content">
                            <!-- Edit Profile Tab -->
                            <div class="tab-pane fade show active" id="edit-profile">
                                <form id="updateProfileForm">
                                    <h5 class="mb-4">Informasi Dasar</h5>
                                    <div class="mb-3">
                                        <label class="form-label">Nama Lengkap</label>
                                        <input type="text" class="form-control" name="name" id="inputName" required>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Email</label>
                                            <input type="email" class="form-control" name="email" id="inputEmail"
                                                required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Nomor Telepon</label>
                                            <input type="text" class="form-control" name="phone" id="inputPhone">
                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-end mt-3">
                                        <button type="submit" class="btn btn-primary px-4">Simpan Perubahan</button>
                                    </div>
                                </form>
                            </div>

                            <!-- Change Password Tab -->
                            <div class="tab-pane fade" id="change-password">
                                <form id="changePasswordForm">
                                    <h5 class="mb-4">Keamanan</h5>
                                    <div class="mb-3">
                                        <label class="form-label">Password Saat Ini</label>
                                        <input type="password" class="form-control" name="old_password" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Password Baru</label>
                                        <input type="password" class="form-control" name="new_password" required
                                            minlength="6">
                                        <div class="form-text">Minimal 6 karakter</div>
                                    </div>
                                    <div class="d-flex justify-content-end mt-3">
                                        <button type="submit" class="btn btn-warning text-white px-4">Ubah
                                            Password</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.app.token) return;

            await loadProfile();

            // Update Profile
            document.getElementById('updateProfileForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                try {
                    const response = await window.app.fetchWithAuth('/api/profile', {
                        method: 'PUT',
                        body: JSON.stringify(data)
                    });
                    if (response.ok) {
                        window.app.showToast('Profil berhasil diperharui');
                        loadProfile();
                    } else {
                        const err = await response.json();
                        alert(err.error || 'Gagal update profil');
                    }
                } catch (error) {
                    console.error(error);
                    alert('Terjadi kesalahan');
                }
            });

            // Change Password
            document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                try {
                    const response = await window.app.fetchWithAuth('/api/profile/password', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                    if (response.ok) {
                        window.app.showToast('Password berhasil diubah');
                        e.target.reset();
                    } else {
                        const err = await response.json();
                        alert(err.error || 'Gagal ubah password');
                    }
                } catch (error) {
                    console.error(error);
                    alert('Terjadi kesalahan');
                }
            });
        });

        async function loadProfile() {
            const user = await window.app.loadUserProfile();
            if (user) {
                document.getElementById('profileName').textContent = user.name;
                document.getElementById('profileEmail').textContent = user.email;
                document.getElementById('profileRole').textContent = user.role === 'admin' ? 'Administrator' : 'Mahasiswa';
                document.getElementById('profilePhone').textContent = user.phone || '-';
                document.getElementById('profileJoined').textContent = window.app.formatDate(user.created_at);

                // Fill form
                document.getElementById('inputName').value = user.name;
                document.getElementById('inputEmail').value = user.email;
                document.getElementById('inputPhone').value = user.phone || '';
            }
        }
    </script>
</body>

</html>
