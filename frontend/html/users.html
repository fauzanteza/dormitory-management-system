<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Sistem Asrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/style.css">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
        }

        .sidebar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            min-height: 100vh;
            position: fixed;
            width: 250px;
            z-index: 1000;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            margin: 5px 10px;
            border-radius: 10px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        /* Card Style */
        .user-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            background: white;
            overflow: hidden;
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            background: #f0f2f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            color: var(--primary);
            font-size: 2.5rem;
        }

        .role-badge {
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .badge-admin {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .badge-student {
            background-color: #d1fae5;
            color: #065f46;
        }

        .empty-state {
            border: 2px dashed #cbd5e1;
            border-radius: 15px;
            padding: 3rem;
            text-align: center;
            background-color: #f8fafc;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="p-4">
            <div class="d-flex align-items-center mb-4">
                <div class="bg-white rounded-circle p-2 me-3"><i class="fas fa-university text-primary fa-lg"></i></div>
                <h4 class="mb-0">Sistem Asrama</h4>
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" href="/dashboard" id="menu-dashboard"><i
                        class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                <a class="nav-link" href="/rooms" id="menu-rooms"><i class="fas fa-bed me-2"></i>Kamar</a>
                <a class="nav-link" href="/residents" id="menu-residents"><i class="fas fa-users me-2"></i>Penghuni</a>
                <a class="nav-link" href="/payments" id="menu-payments"><i
                        class="fas fa-money-bill-wave me-2"></i>Pembayaran</a>
                <a class="nav-link" href="/repairs" id="menu-repairs"><i class="fas fa-tools me-2"></i>Perbaikan</a>
                <a class="nav-link active" href="/users" id="menu-users"><i class="fas fa-user-cog me-2"></i>User</a>
                <div class="mt-4 pt-4 border-top border-white-10">
                    <a class="nav-link" href="/profile" id="menu-profile"><i
                            class="fas fa-user-circle me-2"></i>Profil</a>
                    <a class="nav-link text-danger" href="#" onclick="window.app.logout()"><i
                            class="fas fa-sign-out-alt me-2"></i>Logout</a>
                </div>
            </nav>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark">Data Pengguna</h2>
                <p class="text-muted">Kelola akun pengguna sistem</p>
            </div>
        </div>

        <div id="usersContainer" class="row g-4">
            <!-- Data loaded here -->
        </div>
    </div>

    <!-- Reset Password Modal -->
    <div class="modal fade" id="resetPasswordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Reset Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="resetPasswordForm">
                        <input type="hidden" name="user_id" id="resetUserId">
                        <div class="mb-3">
                            <label class="form-label">Password Baru</label>
                            <input type="password" class="form-control" name="new_password" required>
                        </div>
                        <button type="submit" class="btn btn-warning w-100">Reset Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.app.token) return;

            const user = await window.app.loadUserProfile();
            if (!user || user.role !== 'admin') {
                alert("Akses ditolak");
                window.location.href = '/dashboard';
                return;
            }

            loadUsers();

            document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const userId = document.getElementById('resetUserId').value;
                const newPassword = e.target.new_password.value;

                try {
                    const response = await window.app.fetchWithAuth(`/api/users/${userId}/reset-password`, {
                        method: 'POST',
                        body: JSON.stringify({ new_password: newPassword })
                    });
                    if (response.ok) {
                        window.app.showToast('Password berhasil direset');
                        bootstrap.Modal.getInstance(document.getElementById('resetPasswordModal')).hide();
                        e.target.reset();
                    } else {
                        const err = await response.json();
                        alert(err.error || 'Gagal reset password');
                    }
                } catch (error) {
                    console.error(error);
                    alert('Gagal reset password');
                }
            });
        });

        async function loadUsers() {
            const container = document.getElementById('usersContainer');
            container.innerHTML = '<div class="col-12 text-center"><div class="spinner-border text-primary" role="status"></div></div>';

            try {
                const response = await window.app.fetchWithAuth('/api/users');
                const users = await response.json();

                if (users.length === 0) {
                    container.innerHTML = `
                        <div class="col-12">
                            <div class="empty-state">
                                <i class="fas fa-users-slash fa-4x text-muted mb-3"></i>
                                <h3>Tidak ada pengguna</h3>
                            </div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = users.map(u => `
                    <div class="col-md-4 col-lg-3">
                        <div class="card user-card h-100 text-center p-4">
                            <div class="user-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <h5 class="fw-bold mb-1">${u.name}</h5>
                            <p class="text-muted small mb-3">${u.email}</p>
                            <div class="mb-3">
                                <span class="role-badge badge-${u.role}">
                                    ${u.role}
                                </span>
                            </div>
                            <div class="d-grid gap-2">
                                <button class="btn btn-outline-warning btn-sm" onclick="openResetModal(${u.id})">
                                    <i class="fas fa-key me-1"></i>Reset Password
                                </button>
                                ${u.role !== 'admin' ? `
                                <button class="btn btn-outline-danger btn-sm" onclick="deleteUser(${u.id})">
                                    <i class="fas fa-trash me-1"></i>Hapus
                                </button>` : ''}
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading users:', error);
                container.innerHTML = `
                    <div class="col-12 text-center text-danger">
                        <p>Gagal memuat data user.</p>
                    </div>
                `;
            }
        }

        function openResetModal(id) {
            document.getElementById('resetUserId').value = id;
            new bootstrap.Modal(document.getElementById('resetPasswordModal')).show();
        }

        async function deleteUser(id) {
            if (!confirm('Apakah anda yakin ingin menghapus user ini?')) return;

            try {
                const response = await window.app.fetchWithAuth('/api/users/' + id, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    window.app.showToast('User berhasil dihapus');
                    loadUsers();
                } else {
                    const err = await response.json();
                    alert(err.error || 'Gagal menghapus user');
                }
            } catch (error) {
                console.error(error);
                alert('Gagal menghapus user');
            }
        }
    </script>
</body>

</html>
