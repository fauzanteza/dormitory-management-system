<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penghuni - Sistem Asrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/style.css">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
        }

        .sidebar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            min-height: 100vh;
            position: fixed;
            width: 250px;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            margin: 5px 10px;
            border-radius: 10px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="p-4">
            <div class="d-flex align-items-center mb-4">
                <div class="bg-white rounded-circle p-2 me-3"><i class="fas fa-university text-primary fa-lg"></i></div>
                <h4 class="mb-0">Sistem Asrama</h4>
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" href="/dashboard" id="menu-dashboard"><i
                        class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                <a class="nav-link" href="/rooms" id="menu-rooms"><i class="fas fa-bed me-2"></i>Kamar</a>
                <a class="nav-link active" href="/residents" id="menu-residents"><i
                        class="fas fa-users me-2"></i>Penghuni</a>
                <a class="nav-link" href="/payments" id="menu-payments"><i
                        class="fas fa-money-bill-wave me-2"></i>Pembayaran</a>
                <a class="nav-link" href="/repairs" id="menu-repairs"><i class="fas fa-tools me-2"></i>Perbaikan</a>
                <a class="nav-link" href="/users" id="menu-users"><i class="fas fa-user-cog me-2"></i>User</a>
                <div class="mt-4 pt-4 border-top border-white-10">
                    <a class="nav-link" href="/profile" id="menu-profile"><i
                            class="fas fa-user-circle me-2"></i>Profil</a>
                    <a class="nav-link text-danger" href="#" onclick="window.app.logout()"><i
                            class="fas fa-sign-out-alt me-2"></i>Logout</a>
                </div>
            </nav>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Daftar Penghuni</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addResidentModal"
                id="btnAddResident" style="display:none;">
                <i class="fas fa-plus me-2"></i>Tambah Penghuni
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Nama</th>
                                <th>NIM</th>
                                <th>Fakultas/Jurusan</th>
                                <th>Kamar</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="residentsTableBody">
                            <!-- Data will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Resident Modal -->
    <div class="modal fade" id="addResidentModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Tambah Penghuni Baru</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addResidentForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" name="name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Password (Default)</label>
                                <input type="password" class="form-control" name="password" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">No. Telepon</label>
                                <input type="text" class="form-control" name="phone">
                            </div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">NIM (Student ID)</label>
                                <input type="text" class="form-control" name="student_id" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Fakultas</label>
                                <input type="text" class="form-control" name="faculty">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Jurusan</label>
                                <input type="text" class="form-control" name="major">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Tahun Masuk</label>
                                <input type="number" class="form-control" name="year_of_entry">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Kontak Darurat</label>
                                <input type="text" class="form-control" name="emergency_contact">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Pilih Kamar</label>
                                <select class="form-select" name="room_id" id="roomSelect">
                                    <option value="">-- Pilih Kamar --</option>
                                    <!-- Options loaded via JS -->
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Simpan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await window.app.loadUserProfile();
            if (user && user.role === 'admin') {
                document.getElementById('btnAddResident').style.display = 'block';
                loadRoomsForSelect();
            }

            loadResidents();

            document.getElementById('addResidentForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                // Conversions
                data.year_of_entry = parseInt(data.year_of_entry) || 0;
                if (data.room_id) {
                    data.room_id = parseInt(data.room_id);
                } else {
                    data.room_id = null;
                }

                // If room_id is empty string or NaN, check if it works. 
                // Using JSON.stringify will send "room_id": NaN or string. 
                // Better manual cleanup.
                if (!data.room_id) delete data.room_id;

                try {
                    const response = await window.app.fetchWithAuth('/api/residents', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                    if (response.ok) {
                        window.app.showToast('Penghuni berhasil ditambahkan');
                        bootstrap.Modal.getInstance(document.getElementById('addResidentModal')).hide();
                        e.target.reset();
                        loadResidents();
                        // Also reload room select if room occupancy changed? Maybe not strictly necessary. 
                    } else {
                        const err = await response.json();
                        alert(err.error || 'Gagal menambah penghuni');
                    }
                } catch (error) {
                    console.error(error);
                    alert('Gagal menambah penghuni');
                }
            });
        });

        async function loadResidents() {
            try {
                const response = await window.app.fetchWithAuth('/api/residents');
                const residents = await response.json();
                const tbody = document.getElementById('residentsTableBody');

                tbody.innerHTML = residents.map(r => `
                    <tr>
                        <td>
                            <div class="fw-bold">${r.user ? r.user.name : '-'}</div>
                            <small class="text-muted">${r.user ? r.user.email : '-'}</small>
                        </td>
                        <td>${r.student_id}</td>
                        <td>
                             <div>${r.faculty}</div>
                             <small class="text-muted">${r.major}</small>
                        </td>
                        <td>
                            ${r.room ? `<span class="badge bg-info text-dark">${r.room.room_number}</span>` : '<span class="badge bg-secondary">Belum ada kamar</span>'}
                        </td>
                        <td>
                            <span class="badge bg-${r.status === 'active' ? 'success' : 'secondary'}">
                                ${r.status}
                            </span>
                        </td>
                        <td>
                            <div class="btn-group">
                                <button class="btn btn-sm btn-info text-white" onclick="viewResident(${r.id})"><i class="fas fa-eye"></i></button>
                                <button class="btn btn-sm btn-danger" onclick="deleteResident(${r.id})"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading residents:', error);
            }
        }

        async function loadRoomsForSelect() {
            try {
                // Fetch available rooms (or all rooms?)
                // Ideally backend should provide a list of rooms that are not full or ALL rooms?
                // Using /api/rooms is safer for Admin to override? 
                // But /api/rooms/available is better UX.
                const response = await window.app.fetchWithAuth('/api/rooms/available');
                const rooms = await response.json();
                const select = document.getElementById('roomSelect');

                // Keep default option
                select.innerHTML = '<option value="">-- Pilih Kamar --</option>' +
                    rooms.map(room => `
                        <option value="${room.id}">
                            ${room.room_number} - ${room.building} (Sisa: ${room.capacity - room.current_occupancy})
                        </option>
                    `).join('');
            } catch (error) {
                console.error('Error loading rooms:', error);
            }
        }

        async function deleteResident(id) {
            if (!confirm('Apakah anda yakin ingin menghapus data penghuni ini? User akun juga akan terhapus.')) return;

            try {
                const response = await window.app.fetchWithAuth('/api/residents/' + id, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    window.app.showToast('Penghuni berhasil dihapus');
                    loadResidents();
                } else {
                    const err = await response.json();
                    alert(err.error || 'Gagal menghapus');
                }
            } catch (error) {
                console.error(error);
                alert('Gagal menghapus');
            }
        }

        function viewResident(id) {
            alert('Fitur detail/edit ID: ' + id + ' belum diimplementasikan di demo ini.');
        }
    </script>
</body>

</html>
