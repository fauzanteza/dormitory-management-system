<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perbaikan - Sistem Asrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/style.css">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
        }

        .sidebar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            min-height: 100vh;
            position: fixed;
            width: 250px;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            margin: 5px 10px;
            border-radius: 10px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="p-4">
            <div class="d-flex align-items-center mb-4">
                <div class="bg-white rounded-circle p-2 me-3"><i class="fas fa-university text-primary fa-lg"></i></div>
                <h4 class="mb-0">Sistem Asrama</h4>
            </div>

            <nav class="nav flex-column">
                <a class="nav-link" href="/dashboard" id="menu-dashboard"><i
                        class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                <a class="nav-link" href="/rooms" id="menu-rooms"><i class="fas fa-bed me-2"></i>Kamar</a>
                <a class="nav-link" href="/residents" id="menu-residents"><i class="fas fa-users me-2"></i>Penghuni</a>
                <a class="nav-link" href="/payments" id="menu-payments"><i
                        class="fas fa-money-bill-wave me-2"></i>Pembayaran</a>
                <a class="nav-link active" href="/repairs" id="menu-repairs"><i
                        class="fas fa-tools me-2"></i>Perbaikan</a>
                <a class="nav-link" href="/users" id="menu-users"><i class="fas fa-user-cog me-2"></i>User</a>
                <div class="mt-4 pt-4 border-top border-white-10">
                    <a class="nav-link" href="/profile" id="menu-profile"><i
                            class="fas fa-user-circle me-2"></i>Profil</a>
                    <a class="nav-link text-danger" href="#" onclick="window.app.logout()"><i
                            class="fas fa-sign-out-alt me-2"></i>Logout</a>
                </div>
            </nav>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Permintaan Perbaikan</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addRepairModal">
                <i class="fas fa-plus me-2"></i>Ajukan Perbaikan
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Tanggal</th>
                                <th>Kamar</th>
                                <th>Judul</th>
                                <th>Prioritas</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="repairsTableBody">
                            <!-- Data will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Repair Modal -->
    <div class="modal fade" id="addRepairModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Ajukan Perbaikan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addRepairForm">
                        <div class="mb-3">
                            <label class="form-label">ID Kamar (Room ID)</label>
                            <input type="number" class="form-control" name="room_id" required
                                placeholder="Masukkan ID Kamar">
                            <small class="text-muted">Untuk demo, masukkan ID kamar (misal: 1, 2, dst)</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Judul Keluhan</label>
                            <input type="text" class="form-control" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Detail</label>
                            <textarea class="form-control" name="description" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Prioritas</label>
                            <select class="form-select" name="priority">
                                <option value="low">Rendah</option>
                                <option value="medium" selected>Sedang</option>
                                <option value="high">Tinggi</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Kirim</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.app.loadUserProfile();
            loadRepairs();

            document.getElementById('addRepairForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());
                data.room_id = parseInt(data.room_id);

                try {
                    const response = await window.app.fetchWithAuth('/api/repairs', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        window.app.showToast('Permintaan perbaikan dikirim');
                        bootstrap.Modal.getInstance(document.getElementById('addRepairModal')).hide();
                        e.target.reset();
                        loadRepairs();
                    } else {
                        const err = await response.json();
                        alert(err.error || 'Gagal mengirim permintaan');
                    }
                } catch (error) {
                    console.error(error);
                    alert('Terjadi kesalahan');
                }
            });
        });

        async function loadRepairs() {
            try {
                const response = await window.app.fetchWithAuth('/api/repairs');
                const repairs = await response.json();
                const tbody = document.getElementById('repairsTableBody');

                tbody.innerHTML = repairs.map(r => `
                    <tr>
                        <td>${window.app.formatDate(r.reported_at)}</td>
                        <td>${r.room?.room_number || 'Room ' + r.room_id}</td>
                        <td>${r.title}</td>
                        <td>
                             <span class="badge bg-${r.priority === 'high' ? 'danger' : r.priority === 'medium' ? 'warning' : 'info'}">
                                ${r.priority}
                            </span>
                        </td>
                        <td>
                            <span class="badge bg-${r.status === 'completed' ? 'success' : r.status === 'in_progress' ? 'primary' : 'secondary'}">
                                ${r.status.replace('_', ' ')}
                            </span>
                        </td>
                         <td>
                            <!-- Actions can be added here -->
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading repairs:', error);
            }
        }
    </script>
</body>

</html>
