<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran - Sistem Asrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/style.css">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
        }

        .sidebar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            min-height: 100vh;
            position: fixed;
            width: 250px;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            margin: 5px 10px;
            border-radius: 10px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="p-4">
            <div class="d-flex align-items-center mb-4">
                <div class="bg-white rounded-circle p-2 me-3"><i class="fas fa-university text-primary fa-lg"></i></div>
                <h4 class="mb-0">Sistem Asrama</h4>
            </div>

            <nav class="nav flex-column">
                <a class="nav-link" href="/dashboard" id="menu-dashboard"><i
                        class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                <a class="nav-link" href="/rooms" id="menu-rooms"><i class="fas fa-bed me-2"></i>Kamar</a>
                <a class="nav-link" href="/residents" id="menu-residents"><i class="fas fa-users me-2"></i>Penghuni</a>
                <a class="nav-link active" href="/payments" id="menu-payments"><i
                        class="fas fa-money-bill-wave me-2"></i>Pembayaran</a>
                <a class="nav-link" href="/repairs" id="menu-repairs"><i class="fas fa-tools me-2"></i>Perbaikan</a>
                <a class="nav-link" href="/users" id="menu-users"><i class="fas fa-user-cog me-2"></i>User</a>
                <div class="mt-4 pt-4 border-top border-white-10">
                    <a class="nav-link" href="/profile" id="menu-profile"><i
                            class="fas fa-user-circle me-2"></i>Profil</a>
                    <a class="nav-link text-danger" href="#" onclick="window.app.logout()"><i
                            class="fas fa-sign-out-alt me-2"></i>Logout</a>
                </div>
            </nav>
        </div>
    </div>

    <div class="main-content">
        <h2 class="mb-4">Riwayat Pembayaran</h2>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Tanggal</th>
                                <th>Bulan Tagihan</th>
                                <th>Penghuni</th>
                                <th>Kamar</th>
                                <th>Jumlah</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="paymentsTableBody">
                            <!-- Data will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.app.loadUserProfile();
            loadPayments();
        });

        async function loadPayments() {
            try {
                const response = await window.app.fetchWithAuth('/api/payments');
                const payments = await response.json();
                const tbody = document.getElementById('paymentsTableBody');

                tbody.innerHTML = payments.map(p => `
                    <tr>
                        <td>${p.payment_date ? window.app.formatDate(p.payment_date) : '-'}</td>
                        <td>${new Date(p.month).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' })}</td>
                        <td>${p.resident?.user?.name || '-'}</td>
                        <td>${p.room?.room_number || '-'}</td>
                        <td>${window.app.formatCurrency(p.amount)}</td>
                        <td>
                             <span class="badge bg-${p.status === 'paid' ? 'success' : p.status === 'pending' ? 'warning' : 'danger'}">
                                ${p.status === 'paid' ? 'Lunas' : p.status === 'pending' ? 'Pending' : 'Terlambat'}
                            </span>
                        </td>
                        <td>
                            ${window.app.user.role === 'admin' && p.status !== 'paid' ?
                        `<button class="btn btn-sm btn-success" onclick="markPaid(${p.id})">Tandai Lunas</button>` : ''}
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading payments:', error);
            }
        }

        async function markPaid(id) {
            if (!confirm('Konfirmasi pembayaran lunas?')) return;

            try {
                const response = await window.app.fetchWithAuth(`/api/payments/${id}/status`, {
                    method: 'PUT',
                    body: JSON.stringify({ status: 'paid' })
                });

                if (response.ok) {
                    window.app.showToast('Status pembayaran diperbarui');
                    loadPayments();
                } else {
                    alert('Gagal memperbarui status');
                }
            } catch (error) {
                console.error(error);
                alert('Terjadi kesalahan');
            }
        }
    </script>
</body>

</html>
