<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamar - Sistem Asrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/style.css">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
        }

        .sidebar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            min-height: 100vh;
            position: fixed;
            width: 250px;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            margin: 5px 10px;
            border-radius: 10px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="p-4">
            <div class="d-flex align-items-center mb-4">
                <div class="bg-white rounded-circle p-2 me-3"><i class="fas fa-university text-primary fa-lg"></i></div>
                <h4 class="mb-0">Sistem Asrama</h4>
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" href="/dashboard"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                <a class="nav-link active" href="/rooms"><i class="fas fa-bed me-2"></i>Kamar</a>
                <a class="nav-link" href="/payments"><i class="fas fa-money-bill-wave me-2"></i>Pembayaran</a>
                <a class="nav-link" href="/repairs"><i class="fas fa-tools me-2"></i>Perbaikan</a>
                <div class="mt-4 pt-3 border-top border-white-10">
                    <a class="nav-link text-danger" href="#" onclick="window.app.logout()"><i
                            class="fas fa-sign-out-alt me-2"></i>Logout</a>
                </div>
            </nav>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Daftar Kamar</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addRoomModal" id="btnAddRoom"
                style="display:none;">
                <i class="fas fa-plus me-2"></i>Tambah Kamar
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>No. Kamar</th>
                                <th>Gedung</th>
                                <th>Lantai</th>
                                <th>Kapasitas</th>
                                <th>Harga/Bulan</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="roomsTableBody">
                            <!-- Data will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Room Modal -->
    <div class="modal fade" id="addRoomModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Tambah Kamar Baru</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addRoomForm">
                        <div class="mb-3">
                            <label class="form-label">Nomor Kamar</label>
                            <input type="text" class="form-control" name="room_number" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Gedung</label>
                            <input type="text" class="form-control" name="building" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Lantai</label>
                                <input type="number" class="form-control" name="floor" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Kapasitas</label>
                                <input type="number" class="form-control" name="capacity" value="2" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Harga per Bulan</label>
                            <input type="number" class="form-control" name="monthly_rate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Deskripsi</label>
                            <textarea class="form-control" name="description"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Simpan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await window.app.loadUserProfile();
            if (user && user.role === 'admin') {
                document.getElementById('btnAddRoom').style.display = 'block';
            }

            loadRooms();

            document.getElementById('addRoomForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());
                data.floor = parseInt(data.floor);
                data.capacity = parseInt(data.capacity);
                data.monthly_rate = parseFloat(data.monthly_rate);

                try {
                    const response = await window.app.fetchWithAuth('/api/rooms', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                    if (response.ok) {
                        window.app.showToast('Kamar berhasil ditambahkan');
                        bootstrap.Modal.getInstance(document.getElementById('addRoomModal')).hide();
                        e.target.reset();
                        loadRooms();
                    } else {
                        const err = await response.json();
                        alert(err.error);
                    }
                } catch (error) {
                    console.error(error);
                    alert('Gagal menambah kamar');
                }
            });
        });

        async function loadRooms() {
            try {
                const response = await window.app.fetchWithAuth('/api/rooms');
                const rooms = await response.json();
                const tbody = document.getElementById('roomsTableBody');

                tbody.innerHTML = rooms.map(room => `
                    <tr>
                        <td>${room.room_number}</td>
                        <td>${room.building}</td>
                        <td>${room.floor}</td>
                        <td>${room.current_occupancy}/${room.capacity}</td>
                        <td>${window.app.formatCurrency(room.monthly_rate)}</td>
                        <td>
                            <span class="badge bg-${room.status === 'available' ? 'success' : room.status === 'occupied' ? 'danger' : 'warning'}">
                                ${room.status}
                            </span>
                        </td>
                        <td>
                             <button class="btn btn-sm btn-info text-white" onclick="viewRoom(${room.id})"><i class="fas fa-eye"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading rooms:', error);
            }
        }

        function viewRoom(id) {
            alert('Fitur detail kamar ID: ' + id + ' belum diimplementasikan di demo ini.');
        }
    </script>
</body>

</html>
