<!-- Admin Bookings Management Page -->
<div class="container-fluid">
    <div class="animate__animated animate__fadeIn">
        <h4 class="mb-4"><i class="fas fa-calendar-check me-2"></i>Manajemen Pemesanan Kamar</h4>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card bg-warning text-dark animate__animated animate__fadeInUp">
                <div class="card-body">
                    <h6 class="mb-1">Pending</h6>
                    <h3 class="mb-0" id="pendingCount">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-success text-white animate__animated animate__fadeInUp animate__delay-1s">
                <div class="card-body">
                    <h6 class="mb-1">Approved</h6>
                    <h3 class="mb-0" id="approvedCount">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-danger text-white animate__animated animate__fadeInUp animate__delay-2s">
                <div class="card-body">
                    <h6 class="mb-1">Rejected</h6>
                    <h3 class="mb-0" id="rejectedCount">0</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Bookings Table -->
    <div class="card animate__animated animate__fadeInUp">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Mahasiswa</th>
                            <th>Email</th>
                            <th>Kamar</th>
                            <th>Tanggal Booking</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTableBody">
                        <tr>
                            <td colspan="6" class="text-center py-4">
                                <div class="spinner-border text-primary"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let bookingsData = [];

    async function initBookingsPage() {
        try {
            showLoading();
            await loadBookings();
        } catch (error) {
            console.error('Error loading bookings:', error);
            alert('Gagal memuat data pemesanan: ' + error.message);
        } finally {
            hideLoading();
        }
    }

    async function loadBookings() {
        try {
            bookingsData = await window.adminDashboard.loadBookings();
            displayBookings(bookingsData);
            calculateBookingStats(bookingsData);
        } catch (error) {
            throw error;
        }
    }

    function displayBookings(bookings) {
        const tbody = document.getElementById('bookingsTableBody');

        if (bookings.length === 0) {
            tbody.innerHTML = `
                <tr class="animate__animated animate__fadeIn">
                    <td colspan="6" class="text-center py-4 text-muted">
                        <i class="fas fa-calendar-times fa-3x mb-3"></i>
                        <p class="mb-0">Tidak ada data pemesanan</p>
                    </td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = bookings.map((b, index) => `
        <tr class="animate__animated animate__fadeIn" style="animation-delay: ${index * 0.1}s">
            <td>${b.user?.name || '-'}</td>
            <td>${b.user?.email || '-'}</td>
            <td>${b.room?.room_number || '-'}</td>
            <td>${formatDate(b.created_at)}</td>
            <td><span class="badge ${getStatusBadge(b.status)}">${b.status}</span></td>
            <td>
                <div class="btn-group btn-group-sm" role="group">
                    ${b.status === 'pending' ? `
                        <button class="btn btn-success" onclick="approveBooking(${b.id})" title="Approve">
                            <i class="fas fa-check"></i>
                        </button>
                        <button class="btn btn-danger" onclick="rejectBooking(${b.id})" title="Reject">
                            <i class="fas fa-times"></i>
                        </button>
                    ` : `
                        <button class="btn btn-info" onclick="viewBooking(${b.id})" title="Detail">
                            <i class="fas fa-eye"></i>
                        </button>
                    `}
                </div>
            </td>
        </tr>
    `).join('');
    }

    function calculateBookingStats(bookings) {
        const stats = bookings.reduce((acc, b) => {
            if (b.status === 'pending') acc.pending++;
            else if (b.status === 'approved') acc.approved++;
            else if (b.status === 'rejected') acc.rejected++;
            return acc;
        }, { pending: 0, approved: 0, rejected: 0 });

        document.getElementById('pendingCount').textContent = stats.pending;
        document.getElementById('approvedCount').textContent = stats.approved;
        document.getElementById('rejectedCount').textContent = stats.rejected;
    }

    async function approveBooking(id) {
        if (!confirm('Approve pemesanan ini?')) return;

        try {
            showLoading();
            await window.adminDashboard.updateBookingStatus(id, 'approved');
            alert('Pemesanan berhasil di-approve!');
            await loadBookings();
        } catch (error) {
            alert('Error: ' + error.message);
        } finally {
            hideLoading();
        }
    }

    async function rejectBooking(id) {
        if (!confirm('Reject pemesanan ini?')) return;

        try {
            showLoading();
            await window.adminDashboard.updateBookingStatus(id, 'rejected');
            alert('Pemesanan berhasil di-reject!');
            await loadBookings();
        } catch (error) {
            alert('Error: ' + error.message);
        } finally {
            hideLoading();
        }
    }

    function viewBooking(id) {
        const booking = bookingsData.find(b => b.id === id);
        if (!booking) return;

        alert(`Detail Pemesanan\n\nNama: ${booking.user?.name || '-'}\nEmail: ${booking.user?.email || '-'}\nKamar: ${booking.room?.room_number || '-'}\nStatus: ${booking.status}\nTanggal: ${formatDate(booking.created_at)}`);
    }
</script>
