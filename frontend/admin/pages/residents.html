<!-- Admin Residents Management Page -->
<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="mb-1 animate__animated animate__fadeIn">Manajemen Penghuni</h4>
      <p
        class="text-muted small mb-0 animate__animated animate__fadeIn animate__delay-1s"
      >
        Kelola data penghuni asrama
      </p>
    </div>
    <!-- <button
      class="btn btn-primary animate__animated animate__fadeIn"
      onclick="showAddResidentModal()"
    >
      <i class="fas fa-plus me-2"></i>Tambah Penghuni
    </button> -->
  </div>

  <!-- Filters -->
  <div class="card mb-4 animate__animated animate__fadeInUp">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <select
            class="form-select"
            id="filterStatus"
            onchange="loadResidents()"
          >
            <option value="">Semua Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="graduated">Graduated</option>
          </select>
        </div>
        <div class="col-md-6">
          <input
            type="text"
            class="form-control"
            id="searchName"
            placeholder="Cari nama..."
            onkeyup="loadResidents()"
          />
        </div>
        <div class="col-md-3">
          <button
            class="btn btn-outline-primary w-100"
            onclick="loadResidents()"
          >
            <i class="fas fa-search me-2"></i>Cari
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Residents Table -->
  <div class="card animate__animated animate__fadeInUp animate__delay-1s">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Nama</th>
              <th>Email</th>
              <th>Telepon</th>
              <th>Kamar</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="residentsTableBody">
            <tr>
              <td colspan="7" class="text-center py-4">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2 mb-0">Memuat data...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  let residentsData = [];

  async function initResidentsPage() {
    try {
      showLoading();
      await loadResidents();
      await loadUsersAndRooms();
    } catch (error) {
      console.error('Error loading residents:', error);
      alert('Gagal memuat data penghuni: ' + error.message);
    } finally {
      hideLoading();
    }
  }

  async function loadResidents() {
    const statusEl = document.getElementById('filterStatus');
    const searchEl = document.getElementById('searchName');

    const status = statusEl ? statusEl.value : '';
    const search = searchEl ? searchEl.value : '';

    const params = {};
    if (status) params.status = status;
    if (search) params.name = search;

    residentsData = await window.adminDashboard.loadResidents(params);
    displayResidents(residentsData);
  }

  function displayResidents(residents) {
    const tbody = document.getElementById('residentsTableBody');

    if (residents.length === 0) {
      tbody.innerHTML = `
                <tr class="animate__animated animate__fadeIn">
                    <td colspan="7" class="text-center py-4 text-muted">
                        <i class="fas fa-users-slash fa-3x mb-3"></i>
                        <p class="mb-0">Tidak ada data penghuni</p>
                    </td>
                </tr>
            `;
      return;
    }

    tbody.innerHTML = residents
      .map(
        (r, index) => `
        <tr class="animate__animated animate__fadeIn" style="animation-delay: ${
          index * 0.1
        }s">
            <td><strong>${r.user?.name || '-'}</strong></td>
            <td>${r.user?.email || '-'}</td>
            <td>${r.user?.phone || '-'}</td>
            <td>${r.room?.room_number || 'Belum ada'}</td>
            <td><span class="badge ${getStatusBadge(r.status)}">${
          r.status
        }</span></td>
            <td>
                <div class="btn-group btn-group-sm" role="group">
                    <button class="btn btn-info" onclick="viewResident(${
                      r.id
                    })" title="Detail">
                        <i class="fas fa-eye"></i>
                    </button>
                   
                </div>
            </td>
        </tr>
    `
      )
      .join('');
  }

  async function loadUsersAndRooms() {
    try {
      const userSelect = document.getElementById('userId');
      const roomSelect = document.getElementById('roomId');

      if (!userSelect || !roomSelect) return; // ⬅️ FIX infinity load tersembunyi

      const users = await window.adminDashboard.loadUsers();
      userSelect.innerHTML =
        '<option value="">Pilih User</option>' +
        users
          .filter((u) => u.role === 'student')
          .map((u) => `<option value="${u.id}">${u.name}</option>`)
          .join('');

      const rooms = await window.adminDashboard.loadRooms();
      roomSelect.innerHTML =
        '<option value="">Pilih Kamar</option>' +
        rooms
          .filter((r) => r.status === 'available' || r.status === 'occupied')
          .map((r) => `<option value="${r.id}">${r.room_number}</option>`)
          .join('');
    } catch (error) {
      console.error('Error loading dropdowns:', error);
    }
  }

  function viewResident(id) {
    const resident = residentsData.find((r) => r.id === id);
    if (!resident) return;

    alert(
      `Detail Penghuni\n\nNama: ${resident.user?.name || '-'}\nEmail: ${
        resident.user?.email || '-'
      }\nTelepon: ${resident.user?.phone || '-'}\nKamar: ${
        resident.room?.room_number || 'Belum ada'
      }\nStatus: ${resident.status}\nNIM: ${resident.student_id || '-'}`
    );
  }

  document.addEventListener('DOMContentLoaded', initResidentsPage);
</script>
