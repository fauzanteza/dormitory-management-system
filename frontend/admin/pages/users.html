<!-- Admin Users Management Page -->
<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="mb-1 animate__animated animate__fadeIn">Manajemen User</h4>
      <p
        class="text-muted small mb-0 animate__animated animate__fadeIn animate__delay-1s"
      >
        Kelola akun pengguna sistem
      </p>
    </div>
  </div>

  <!-- Stats -->
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div
        class="card bg-primary text-white animate__animated animate__fadeInUp"
      >
        <div class="card-body">
          <h6 class="mb-1">Total Admin</h6>
          <h3 class="mb-0" id="totalAdmin">0</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div
        class="card bg-success text-white animate__animated animate__fadeInUp animate__delay-1s"
      >
        <div class="card-body">
          <h6 class="mb-1">Total Mahasiswa</h6>
          <h3 class="mb-0" id="totalStudent">0</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div
        class="card bg-info text-white animate__animated animate__fadeInUp animate__delay-2s"
      >
        <div class="card-body">
          <h6 class="mb-1">Total User</h6>
          <h3 class="mb-0" id="totalUsers">0</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="card mb-4 animate__animated animate__fadeInUp">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <select class="form-select" id="filterRole" onchange="loadUsers()">
            <option value="">Semua Role</option>
            <option value="admin">Admin</option>
            <option value="student">Student</option>
          </select>
        </div>
        <div class="col-md-6">
          <input
            type="text"
            class="form-control"
            id="searchUser"
            placeholder="Cari nama atau email..."
            onkeyup="loadUsers()"
          />
        </div>
        <!-- <div class="col-md-3">
          <button
            class="btn btn-outline-primary w-100"
            onclick="showAddUserModal()"
          >
            <i class="fas fa-plus me-2"></i>Tambah User
          </button>
        </div> -->
      </div>
    </div>
  </div>

  <!-- Users Table -->
  <div class="card animate__animated animate__fadeInUp animate__delay-1s">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Nama</th>
              <th>Email</th>
              <th>Telepon</th>
              <th>Role</th>
              <th>Bergabung</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr>
              <td colspan="7" class="text-center py-4">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2 mb-0">Memuat data...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  let allUsers = [];
  let usersData = [];

  async function initUsersPage() {
    showLoading();
    allUsers = await window.adminDashboard.loadUsers();
    usersData = allUsers;
    displayUsers(usersData);
    calculateUserStats(usersData);
    hideLoading();
  }

  window.loadUsers = function () {
    const role = filterRole.value;
    const search = searchUser.value.toLowerCase();

    usersData = allUsers.filter((u) => {
      const matchRole = !role || u.role === role;
      const matchSearch =
        !search ||
        u.name.toLowerCase().includes(search) ||
        u.email.toLowerCase().includes(search);

      return matchRole && matchSearch;
    });

    displayUsers(usersData);
    calculateUserStats(usersData);
  };

  function displayUsers(users) {
    const tbody = document.getElementById('usersTableBody');

    if (users.length === 0) {
      tbody.innerHTML = `
                <tr class="animate__animated animate__fadeIn">
                    <td colspan="7" class="text-center py-4 text-muted">
                        <i class="fas fa-user-slash fa-3x mb-3"></i>
                        <p class="mb-0">Tidak ada data user</p>
                    </td>
                </tr>
            `;
      return;
    }

    tbody.innerHTML = users
      .map(
        (u, index) => `
        <tr class="animate__animated animate__fadeIn" style="animation-delay: ${
          index * 0.1
        }s">
            <td><strong>${u.name}</strong></td>
            <td>${u.email}</td>
            <td>${u.phone || '-'}</td>
            <td><span class="badge ${
              u.role === 'admin' ? 'bg-primary' : 'bg-success'
            }">${u.role}</span></td>
            <td>${formatDate(u.created_at)}</td>
            <td><span class="badge ${
              u.status === 'active' ? 'bg-success' : 'bg-secondary'
            }">${u.status || 'active'}</span></td>
            <td>
                <div class="btn-group btn-group-sm" role="group">
                    <button class="btn btn-info" onclick="viewUser(${
                      u.id
                    })" title="Detail">
                        <i class="fas fa-eye"></i>
                    </button>
                    <button class="btn btn-warning" onclick="resetPassword(${
                      u.id
                    })" title="Reset Password">
                        <i class="fas fa-key"></i>
                    </button>
                </div>
            </td>
        </tr>
    `
      )
      .join('');
  }

  function calculateUserStats(users) {
    const stats = users.reduce(
      (acc, u) => {
        if (u.role === 'admin') acc.admin++;
        else if (u.role === 'student') acc.student++;
        return acc;
      },
      { admin: 0, student: 0 }
    );

    document.getElementById('totalAdmin').textContent = stats.admin;
    document.getElementById('totalStudent').textContent = stats.student;
    document.getElementById('totalUsers').textContent = users.length;
  }

  function viewUser(id) {
    const user = usersData.find((u) => u.id === id);
    if (!user) return;

    document.getElementById('detailName').textContent = user.name;
    document.getElementById('detailEmail').textContent = user.email;
    document.getElementById('detailPhone').textContent = user.phone || '-';
    document.getElementById('detailRole').textContent = user.role;
    document.getElementById('detailRole').className = `badge ${
      user.role === 'admin' ? 'bg-primary' : 'bg-success'
    }`;
    document.getElementById('detailCreated').textContent = formatDate(
      user.created_at
    );
    document.getElementById('detailStatus').textContent =
      user.status || 'active';
    document.getElementById('detailStatus').className = `badge ${
      user.status === 'active' ? 'bg-success' : 'bg-secondary'
    }`;

    new bootstrap.Modal(document.getElementById('userDetailModal')).show();
  }

  async function saveNewUser(event) {
    event.preventDefault();

    const userData = {
      name: document.getElementById('newUserName').value,
      email: document.getElementById('newUserEmail').value,
      phone: document.getElementById('newUserPhone').value,
      role: document.getElementById('newUserRole').value,
      password: document.getElementById('newUserPassword').value,
    };

    try {
      showLoading();
      await window.adminDashboard.createUser(userData);
      alert('User berhasil ditambahkan!');
      bootstrap.Modal.getInstance(
        document.getElementById('addUserModal')
      ).hide();
      await loadUsers();
    } catch (error) {
      alert('Error: ' + error.message);
    } finally {
      hideLoading();
    }
  }

  async function resetPassword(id) {
    const newPassword = prompt('Masukkan password baru (min. 6 karakter):');
    if (!newPassword) return;

    if (newPassword.length < 6) {
      alert('Password minimal 6 karakter!');
      return;
    }

    if (!confirm('Reset password untuk user ini?')) return;

    try {
      showLoading();
      const response = await window.auth.fetchWithAuth(
        `/api/admin/users/${id}/reset-password`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ new_password: newPassword }),
        }
      );

      if (!response.ok) throw new Error('Failed to reset password');
      alert('Password berhasil direset!');
    } catch (error) {
      alert('Error: ' + error.message);
    } finally {
      hideLoading();
    }
  }

  document.addEventListener('DOMContentLoaded', initUsersPage);
</script>
